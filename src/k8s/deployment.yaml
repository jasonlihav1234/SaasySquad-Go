apiVersion: apps/v1
kind: Deployment
metadata:
  name: saasysquad-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: saasysquad-pod
          image: raghavkarmaker123/saasysquad:v2
          ports:
            - containerPort: 7000
